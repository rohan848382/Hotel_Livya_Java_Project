<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('https://images.unsplash.com/photo-1591622776326-6c46efaa0c8a?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 40px 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: #cc66cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #a64ca6;
    }

    .align-right {
      text-align: right;
      margin-top: 15px;
    }

    .align-right a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    .align-right a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <form action="login" method="post">
    <div class="container">
      <h2>Login</h2>
      <div class="form-group">
        <label for="uname">Username</label>
        <input type="text" id="uname" name="uname" required>
      </div>
      <div class="form-group">
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" required>
      </div>
      <input type="submit" value="Login" class="btn-submit">
      <div class="align-right">
        <a href="register.html">New User?</a>
      </div>
    </div>
  </form>
</body>

</html>
