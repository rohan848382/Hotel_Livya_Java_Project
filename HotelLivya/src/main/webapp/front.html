<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hotel Livya</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background-image: url('taj2.jpg'); /* Ensure this image is in the same folder */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      color: #333;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
      color: #ffaa66;
      text-shadow: 1px 1px #333;
      text-decoration: underline;
    }

    .button-link {
      text-decoration: none;
      display: inline-block;
      margin: 10px;
    }

    .button {
      background-color: #ffcc99;
      color: #333;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .button:hover {
      background-color: #ffaa66;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
    }

    .footer a {
      color: #333;
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .trade-name {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🏨 HOTEL LIVYA</h1>
    <a href="login.html" class="button-link"><button class="button">Login</button></a><br>
    <a href="register.html" class="button-link"><button class="button">Register</button></a><br>
    <a href="contact.html" class="button-link"><button class="button">Contact Us</button></a><br>
    <a href="front.html" class="button-link"><button class="button">Exit</button></a>

    <div class="footer">
      <br><br>
      <span>Email:</span> <a href="mailto:sheikhbil99@gmail.com">sheikhbil99@gmail.com</a>
      <p>&copy; <span class="trade-name">Bilal Ahmad</span> - All Rights Reserved</p>
    </div>
  </div>
</body>

</html>
